name: Build Debug APK
# Rebuild after Firebase google-services.json updates in the website repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact icon from the supplied PaliaAPK HUB website assets
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/shanpalia/WebsitePaliaAPK_V.2/main/assets/icon.png --output web/assets/icon.png

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and patch Android project
        run: npm run android:prepare

      - name: Restore Firebase Android configuration and enable Google Sign-In
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/shanpalia/WebsitePaliaAPK_V.2/main/google-services.json --output android/app/google-services.json
          node scripts/patch-android.js

      - name: Validate app JavaScript syntax
        run: node --check web/app.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Print APK signing certificate SHA-1 for Firebase OAuth
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'Owner:|Issuer:|SHA1:'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PaliaAPK-HUB-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
