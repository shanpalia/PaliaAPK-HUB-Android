name: Build Debug APK
# Rebuild after Firebase google-services.json updates in the website repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact icon from the supplied PaliaAPK HUB website assets
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/shanpalia/WebsitePaliaAPK_V.2/main/assets/icon.png --output web/assets/icon.png

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and patch Android project
        run: npm run android:prepare

      - name: Restore Firebase Android configuration and enable Google Sign-In
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/shanpalia/WebsitePaliaAPK_V.2/main/google-services.json --output android/app/google-services.json
          node scripts/patch-android.js

      - name: Validate Firebase Android and Google OAuth configuration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/google-services.json';
          const pkg = 'com.shanpalia.paliaapkhub';
          const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const client = (cfg.client || []).find(c =>
            (c.client_info?.android_client_info?.package_name || '') === pkg
          );
          if (!client) {
            console.error('ERROR: google-services.json has no Android client for ' + pkg);
            process.exit(1);
          }
          const oauth = client.oauth_client || [];
          const webClient = oauth.find(c => Number(c.client_type) === 3 && c.client_id);
          const androidClients = oauth.filter(c =>
            Number(c.client_type) === 1 &&
            c.android_info?.package_name === pkg &&
            c.android_info?.certificate_hash
          );
          if (!webClient) {
            console.error('ERROR: No Web OAuth client (client_type 3) found for ' + pkg);
            process.exit(1);
          }
          console.log('Firebase project:', cfg.project_info?.project_id || '(missing)');
          console.log('Android package:', pkg);
          console.log('Android OAuth SHA-1 fingerprints in JSON:', androidClients.length);
          console.log('Web OAuth client ID is present.');
          NODE

      - name: Confirm latest Firebase config contains persistent signing SHA-1
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const pkg = 'com.shanpalia.paliaapkhub';
          const expectedSha1 = 'B4F5C2A22140C2A6E732C2137DEC0749EC4B3289';
          const client = (cfg.client || []).find(c => c.client_info?.android_client_info?.package_name === pkg);
          const configured = (client?.oauth_client || [])
            .filter(c => Number(c.client_type) === 1 && c.android_info?.package_name === pkg)
            .map(c => String(c.android_info?.certificate_hash || '').replace(/:/g, '').toUpperCase());
          console.log('Firebase JSON loaded for', pkg);
          console.log('Configured Android OAuth SHA-1 count:', configured.length);
          if (!configured.includes(expectedSha1)) {
            console.error('WARNING: Persistent keystore SHA-1 is not in google-services.json yet.');
            console.error('Add SHA-1 B4:F5:C2:A2:21:40:C2:A6:E7:32:C2:13:7D:EC:07:49:EC:4B:32:89 in Firebase Console, download updated google-services.json, and update WebsitePaliaAPK_V.2.');
          } else {
            console.log('Persistent signing SHA-1 is present in Firebase config.');
          }
          NODE

      - name: Validate app JavaScript syntax
        run: node --check web/app.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign APK with persistent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: GitHub secret KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: GitHub secret KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: GitHub secret KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: GitHub secret KEY_PASSWORD is missing"; exit 1; }

          KEYSTORE_FILE="$RUNNER_TEMP/paliaapk-release.jks"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="$RUNNER_TEMP/app-debug-signed.apk"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE" || { echo "ERROR: decoded keystore is empty"; exit 1; }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER" || { echo "ERROR: Android apksigner not found"; exit 1; }

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          mv "$SIGNED_APK" "$APK"
          rm -f "$KEYSTORE_FILE"

      - name: Verify final APK signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'Owner:|Issuer:|SHA1:|SHA256:'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PaliaAPK-HUB-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
