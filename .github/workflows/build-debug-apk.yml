name: Build Debug APK
# Rebuild after Firebase google-services.json updates in the website repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact icon from the supplied PaliaAPK HUB website assets
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/shanpalia/WebsitePaliaAPK_V.2/main/assets/icon.png --output web/assets/icon.png

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and patch Android project
        run: npm run android:prepare

      - name: Restore Firebase Android configuration and enable Google Sign-In
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/shanpalia/WebsitePaliaAPK_V.2/main/google-services.json --output android/app/google-services.json
          node scripts/patch-android.js

      - name: Validate Firebase Android and Google OAuth configuration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/google-services.json';
          const pkg = 'com.shanpalia.paliaapkhub';
          const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const client = (cfg.client || []).find(c =>
            (c.client_info?.android_client_info?.package_name || '') === pkg
          );
          if (!client) {
            console.error('ERROR: google-services.json has no Android client for ' + pkg);
            process.exit(1);
          }
          const oauth = client.oauth_client || [];
          const webClient = oauth.find(c => Number(c.client_type) === 3 && c.client_id);
          const androidClients = oauth.filter(c =>
            Number(c.client_type) === 1 &&
            c.android_info?.package_name === pkg &&
            c.android_info?.certificate_hash
          );
          if (!webClient) {
            console.error('ERROR: No Web OAuth client (client_type 3) found for ' + pkg);
            process.exit(1);
          }
          console.log('Firebase project:', cfg.project_info?.project_id || '(missing)');
          console.log('Android package:', pkg);
          console.log('Android OAuth SHA-1 fingerprints in JSON:', androidClients.length);
          console.log('Web OAuth client ID is present.');
          NODE

      - name: Confirm latest Firebase config contains current debug SHA-1
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const pkg = 'com.shanpalia.paliaapkhub';
          const client = (cfg.client || []).find(c => c.client_info?.android_client_info?.package_name === pkg);
          console.log('Firebase JSON loaded for', pkg);
          console.log('Configured Android SHA-1 fingerprints:', (client?.oauth_client || []).filter(c => Number(c.client_type) === 1).map(c => c.android_info?.certificate_hash).join(', '));
          NODE

      - name: Validate app JavaScript syntax
        run: node --check web/app.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Print APK signing certificate SHA-1 and SHA-256 for Firebase OAuth
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'Owner:|Issuer:|SHA1:|SHA256:'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PaliaAPK-HUB-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
