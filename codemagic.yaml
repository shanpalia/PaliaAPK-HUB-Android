workflows:
  paliaapk-hub-android:
    name: PaliaAPK HUB Signed Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 22.11.0
      android_signing:
        - keystore_reference: paliaapk-release
    scripts:
      - name: Restore exact PaliaAPK HUB app icon
        script: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/shanpalia/WebsitePaliaAPK_V.2/main/assets/icon.png --output web/assets/icon.png
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Prepare and sign Android project
        script: |
          npm run android:prepare
          test -n "$CM_KEYSTORE_PATH"
          test -f "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
      - name: Build signed release APK
        script: |
          cd android
          gradle clean
          gradle assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
