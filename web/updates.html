<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Updates | PaliaAPK HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#0f172a}.card{border:1px solid #e5e7eb;border-radius:20px;background:#fff;transition:.2s}.card:hover{border-color:#bbf7d0;box-shadow:0 12px 30px rgba(22,163,74,.08)}.mint{color:#16a34a}</style>
</head>
<body class="min-h-screen bg-white">
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-green-600 text-white flex items-center justify-center font-black">P</div>
      <div><div class="font-black">PaliaAPK <span class="mint">HUB</span></div><div class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">App Updates</div></div>
    </a>
    <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-green-50 text-sm font-bold"><i class="fa-solid fa-house mr-1"></i> Store</a>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-8">
  <div class="flex items-end justify-between gap-4 mb-6">
    <div><h1 class="text-2xl sm:text-3xl font-black">Available Updates</h1><p class="text-sm text-gray-500 mt-1">Apps that have a newer version available.</p></div>
    <button id="refreshBtn" class="px-4 py-2 rounded-xl bg-green-600 text-white text-sm font-bold"><i class="fa-solid fa-rotate mr-1"></i> Refresh</button>
  </div>
  <div id="status" class="text-sm text-gray-500 py-10 text-center">Loading updates...</div>
  <div id="updatesGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
</main>
<script>
const SUPABASE_URL='https://ralinnuegsbuvlhwpzln.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwiaWF0IjoxNzgwMjk1NjQyLCJleHAiOjIwOTU4NzE2NDJ9.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIFE';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const grid=document.getElementById('updatesGrid'), status=document.getElementById('status');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function loadUpdates(){
 status.textContent='Loading updates...'; grid.innerHTML='';
 const {data,error}=await sb.from('apps').select('id,name,developer,icon_url,version,previous_version,update_available,updated_at').eq('update_available',true).order('updated_at',{ascending:false});
 if(error){
   console.error('Updates query failed:', error);
   status.innerHTML='<span class="text-red-600 font-bold">Unable to load updates.</span><br><span class="text-xs">Supabase error: '+esc(error.message||'Unknown error')+'</span>';
   return;
 }
 // Only show genuine table-marked updates. Never create a fake update list.
 const updates=(data||[]).filter(app=>app.update_available===true);
 if(!updates.length){status.textContent='No updates available right now.';return;}
 status.textContent=`${updates.length} app${updates.length===1?'':'s'} with updates`;
 grid.innerHTML=updates.map(app=>`
 <article class="card p-4 flex flex-col relative overflow-hidden">
   <div class="absolute top-3 right-3 px-2 py-1 rounded-full bg-green-50 text-green-700 text-[10px] font-black border border-green-100">UPDATE AVAILABLE</div>
   <div class="flex items-center gap-3 pr-20">
     <img src="${esc(app.icon_url||'')}" class="w-14 h-14 rounded-xl object-contain bg-gray-50 p-1" alt="${esc(app.name)}">
     <div class="min-w-0"><h2 class="font-black text-sm truncate">${esc(app.name)}</h2><p class="text-xs text-gray-500 truncate">${esc(app.developer||'ShanPalia')}</p></div>
   </div>
   <div class="mt-4 rounded-xl bg-gray-50 border border-gray-100 p-3">
     <div class="text-[10px] uppercase tracking-wider font-black text-gray-400 mb-2">Version update</div>
     <div class="flex items-center justify-between gap-2 text-xs font-black">
       <span class="px-2.5 py-1.5 rounded-lg bg-white border border-gray-200 text-gray-500">v${esc(app.previous_version||'—')}</span>
       <i class="fa-solid fa-arrow-right text-green-600"></i>
       <span class="px-2.5 py-1.5 rounded-lg bg-green-50 border border-green-100 text-green-700">v${esc(app.version||'—')}</span>
     </div>
   </div>
   ${app.updated_at ? `<p class="mt-2 text-[10px] text-gray-400"><i class="fa-regular fa-clock mr-1"></i>Updated ${esc(new Date(app.updated_at).toLocaleDateString())}</p>` : ''}
   <a href="app.html?id=${encodeURIComponent(app.id)}" class="mt-4 w-full text-center rounded-xl bg-green-600 hover:bg-green-700 text-white py-2.5 text-xs font-black"><i class="fa-solid fa-arrow-up mr-1"></i> Update Now</a>
 </article>`).join('');
}
document.getElementById('refreshBtn').addEventListener('click',loadUpdates);
loadUpdates();
</script>
</body></html>
