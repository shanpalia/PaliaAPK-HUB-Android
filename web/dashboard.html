<script id="paliaDarkModeController">
(function () {
  const KEY = 'paliaapk_theme';

  function applyTheme(theme) {
    const root = document.documentElement;
    const dark = theme === 'dark';
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#111827' : '#16a34a');
  }

  function getTheme() {
    const saved = localStorage.getItem(KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }

  applyTheme(getTheme());

  document.addEventListener('DOMContentLoaded', function () {
    applyTheme(getTheme());

    const btn = document.getElementById('darkModeToggle');
    if (!btn || btn.dataset.darkModeBound === '1') return;

    btn.dataset.darkModeBound = '1';
    btn.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      const next = document.documentElement.classList.contains('dark')
        ? 'light' : 'dark';

      localStorage.setItem(KEY, next);
      applyTheme(next);
    });
  });
})();
</script>

<script>

    alert("Access Denied!");

}
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://ralinnuegsbuvlhwpzln.supabase.co'; // यहाँ अपनी Supabase URL डालें
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDIsImV4cCI6MjA5NTg3MTY0Mn0.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIFE'; // यहाँ अपनी Supabase Anon/Public Key डालें

const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Sidebar Functionality
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeSidebar");
const overlay = document.getElementById("overlay");

function openSidebar(){
 sidebar.classList.add("active");
 overlay.style.display="block";
}

function closeSidebar(){
 sidebar.classList.remove("active");
 overlay.style.display="none";
}

menuBtn.addEventListener("click", openSidebar);
closeBtn.addEventListener("click", closeSidebar);
overlay.addEventListener("click", closeSidebar);

document.querySelectorAll(".menu a").forEach(a=>{
 a.addEventListener("click", closeSidebar);
});

// --- FETCH DATA & APPS FROM SUPABASE ---
async function fetchDashboardData() {
 try {
  // 1. Fetch Total Apps Count & App List from 'apps' table
  const { data: apps, count, error } = await _supabase
    .from('apps')
    .select('*', { count: 'exact' });

  if (error) throw error;

  // Update Total Apps Card
  if (count !== null) {
    document.getElementById("totalApps").innerText = count;
  }
// ===============================
// TOTAL DOWNLOADS
// ===============================

const totalDownloads = (apps || []).reduce((total, app) => {
    return total + Number(app.downloads || 0);
}, 0);

document.getElementById("totalDownloads").innerText =
    totalDownloads.toLocaleString();
  // Populate App Table List
  const tableBody = document.getElementById("appTableBody");
  tableBody.innerHTML = "";

  if (!apps || apps.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#777;">No apps found.</td></tr>`;
    return;
  }
// ===============================
// TOTAL SITE VISITS
// ===============================

const { count: visitCount, error: visitError } = await _supabase
    .from("site_visits")
    .select("*", {
        count: "exact",
        head: true
    });

if (visitError) {
    console.error("Visit Count Error:", visitError);
} else {
    document.getElementById("totalSiteVisits").innerText =
        Number(visitCount || 0).toLocaleString();
}
  // ===============================
// TOTAL USERS
// ===============================

const { count: userCount, error: userError } = await _supabase
    .from("users")
    .select("*", {
        count: "exact",
        head: true
    });

if (userError) {
    console.error("User Count Error:", userError);
} else {
    document.getElementById("totalUsers").innerText =
        Number(userCount || 0).toLocaleString();
}
  apps.forEach(app => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td style="font-weight:600;">${app.name || app.title || 'N/A'}</td>
      <td>${app.version || 'N/A'}</td>
      <td>${app.category || 'N/A'}</td>
      <td>
        <div class="action-btns">
          <button onclick="editApp('${app.id}')" class="btn-edit"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
          <button onclick="deleteApp('${app.id}')" class="btn-delete"><i class="fa-solid fa-trash"></i> Delete</button>
        </div>
      </td>
    `;
    tableBody.appendChild(row);
  });

 } catch (err) {
  console.error("Error loading dashboard data:", err.message);
  document.getElementById("appTableBody").innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Failed to load apps. Check console.</td></tr>`;
 }
}

// Edit App Function (Redirects to add-app page or opens edit modal with ID)
function editApp(id) {
 // आप चाहें तो इसे अपने add-app.html पर भेज सकते हैं या एडिट पेज पर (जैसे: add-app.html?id=...)
 window.location.href = `add-app.html?id=${id}`;
}

// Delete App Function
async function deleteApp(id) {
 if (confirm("Are you sure you want to delete this app?")) {
  try {
    const { error } = await _supabase
      .from('apps')
      .delete()
      .eq('id', id);

    if (error) throw error;

    alert("App deleted successfully!");
    fetchDashboardData(); // लिस्ट को दोबारा रिफ्रेश करें
  } catch (err) {
    alert("Error deleting app: " + err.message);
  }
 }
}

// पेज लोड होने पर डेटा फेच करें
window.addEventListener("DOMContentLoaded", fetchDashboardData);
 // ===== Logout =====

document.getElementById("logoutBtn").addEventListener("click", async (e) => {

    e.preventDefault();

    sessionStorage.removeItem("adminLoggedIn");

    alert("Logged out successfully.");

    window.location.replace("admin.html");

});
</script>
