<script id="paliaDarkModeController">
(function () {
  const KEY = 'paliaapk_theme';

  function applyTheme(theme) {
    const root = document.documentElement;
    const dark = theme === 'dark';
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#111827' : '#16a34a');
  }

  function getTheme() {
    const saved = localStorage.getItem(KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }

  applyTheme(getTheme());

  document.addEventListener('DOMContentLoaded', function () {
    applyTheme(getTheme());

    const btn = document.getElementById('darkModeToggle');
    if (!btn || btn.dataset.darkModeBound === '1') return;

    btn.dataset.darkModeBound = '1';
    btn.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      const next = document.documentElement.classList.contains('dark')
        ? 'light' : 'dark';

      localStorage.setItem(KEY, next);
      applyTheme(next);
    });
  });
})();
</script>

<script>

    measurementId: "G-7BMQEGPY8C"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

auth.onAuthStateChanged(async user => {
    if (!user) {
        window.location.href = "user.html";
        return;
    }

    currentUser = user;
    document.getElementById("userEmail").textContent = user.email || "Signed in";
    await loadFavorites();
});

async function loadFavorites() {
    if (!currentUser) return;

    const loading = document.getElementById("loadingState");
    const error = document.getElementById("errorState");
    const empty = document.getElementById("emptyState");
    const list = document.getElementById("favoritesList");

    loading.classList.remove("hidden");
    error.classList.add("hidden");
    empty.classList.add("hidden");
    list.classList.add("hidden");
    list.innerHTML = "";

    try {
        const { data, error: dbError } = await db
            .from("favorites")
            .select("*")
            .eq("user_id", currentUser.uid)
            .order("created_at", { ascending: false });

        if (dbError) throw dbError;

        loading.classList.add("hidden");

        const favorites = data || [];
        document.getElementById("favoriteCount").textContent =
            favorites.length.toLocaleString();

        if (!favorites.length) {
            empty.classList.remove("hidden");
            return;
        }

        favorites.forEach(item => {
            const row = document.createElement("div");
            row.className = "app-card bg-white rounded-3xl border border-gray-100 shadow-sm p-4 sm:p-5";

            const icon = item.icon_url || "";
            const name = item.app_name || "Unknown App";
            const version = item.version || "Unknown";

            row.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-2xl bg-green-50 overflow-hidden flex-shrink-0 flex items-center justify-center text-green-600 text-2xl">
                        ${icon
                            ? `<img src="${escapeHtml(icon)}" class="w-full h-full object-cover" alt="">`
                            : `<i class="fa-solid fa-mobile-screen-button"></i>`}
                    </div>

                    <div class="min-w-0 flex-1">
                        <h3 class="font-black text-gray-900 truncate">${escapeHtml(name)}</h3>
                        <p class="text-xs text-gray-500 mt-1">Version ${escapeHtml(version)}</p>
                    </div>

                    <button
                        onclick="removeFavorite('${escapeJs(item.id)}')"
                        class="flex-shrink-0 w-11 h-11 rounded-xl bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100"
                        title="Remove from favorites">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                    ${item.app_id ? `
                    <a href="app.html?id=${encodeURIComponent(item.app_id)}"
                       class="flex-shrink-0 w-11 h-11 rounded-xl bg-green-50 text-green-600 flex items-center justify-center hover:bg-green-100"
                       title="Open app">
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>` : ""}
                </div>
            `;

            list.appendChild(row);
        });

        list.classList.remove("hidden");

    } catch (err) {
        console.error("Favorites error:", err);
        loading.classList.add("hidden");
        error.classList.remove("hidden");
        document.getElementById("errorText").textContent =
            err.message || "Please try again.";
    }
}

async function removeFavorite(id) {
    if (!currentUser || !id) return;

    if (!confirm("Remove this app from Favorites?")) return;

    const { error } = await db
        .from("favorites")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.uid);

    if (error) {
        alert("Could not remove favorite: " + error.message);
        return;
    }

    await loadFavorites();
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeJs(value) {
    return String(value ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}
</script>
