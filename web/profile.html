<script id="paliaDarkModeController">
(function () {
  const KEY = 'paliaapk_theme';

  function applyTheme(theme) {
    const root = document.documentElement;
    const dark = theme === 'dark';
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#111827' : '#16a34a');
  }

  function getTheme() {
    const saved = localStorage.getItem(KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }

  applyTheme(getTheme());

  document.addEventListener('DOMContentLoaded', function () {
    applyTheme(getTheme());

    const btn = document.getElementById('darkModeToggle');
    if (!btn || btn.dataset.darkModeBound === '1') return;

    btn.dataset.darkModeBound = '1';
    btn.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      const next = document.documentElement.classList.contains('dark')
        ? 'light' : 'dark';

      localStorage.setItem(KEY, next);
      applyTheme(next);
    });
  });
})();
</script>

            messagingSenderId: "270953807883",
            appId: "1:270953807883:web:c900f4409938f16477870e",

        if (!firebase.apps.length) {

        // ===============================
        // LIVE APP UPDATES
        // ===============================
        (function(){
            const btn = document.getElementById('profileUpdatesBtn');
            const modal = document.getElementById('profileUpdatesModal');
            const closeBtn = document.getElementById('closeProfileUpdates');
            const list = document.getElementById('profileUpdatesList');
            const count = document.getElementById('profileUpdatesCount');

            function esc(v){
                return String(v ?? '').replace(/[&<>"']/g, c => ({
                    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
                }[c]));
            }

            function closeModal(){
                modal?.classList.add('hidden');
                modal?.classList.remove('flex');
            }

            async function loadUpdates(){
                if(!list || !paliaSupabase) return;
                list.innerHTML = '<div class="py-10 text-center text-sm text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Checking for updates...</div>';

                try{
                    const {data, error} = await paliaSupabase
                        .from('apps')
                        .select('id,name,version,previous_version,update_available,release_notes,icon_url,apk_url,telegram_message_id,updated_at')
                        .eq('update_available', true)
                        .order('updated_at', {ascending:false});

                    if(error) throw error;

                    const apps = Array.isArray(data) ? data : [];
                    count.textContent = String(apps.length);
                    count.classList.toggle('hidden', apps.length === 0);
                    count.classList.toggle('inline-flex', apps.length > 0);

                    if(!apps.length){
                        list.innerHTML = `
                          <div class="py-10 text-center">
                            <div class="w-14 h-14 mx-auto rounded-2xl bg-green-50 text-green-600 flex items-center justify-center text-xl">
                              <i class="fa-solid fa-check"></i>
                            </div>
                            <p class="mt-3 font-black text-gray-800">You're up to date</p>
                            <p class="text-xs text-gray-500 mt-1">No app update is currently available.</p>
                          </div>`;
                        return;
                    }

                    list.innerHTML = apps.map(app => `
                      <div class="w-full flex items-center gap-3 p-3 mb-2 rounded-2xl border border-gray-100 hover:border-green-200 hover:bg-green-50 transition">
                        <button type="button" data-update-app="${esc(app.id)}" class="flex items-center gap-3 min-w-0 flex-1 text-left">
                          <div class="w-12 h-12 rounded-xl bg-gray-100 overflow-hidden flex items-center justify-center shrink-0">
                            ${app.icon_url ? `<img src="${esc(app.icon_url)}" class="w-full h-full object-cover" alt="">` :
                            `<i class="fa-solid fa-android text-green-500 text-xl"></i>`}
                          </div>
                          <div class="min-w-0">
                            <p class="font-black text-sm text-gray-900 truncate">${esc(app.name)}</p>
                            <p class="text-xs text-gray-500 mt-0.5">Version <b class="text-green-600">${esc(app.version || '—')}</b>${app.previous_version ? ` · Previous ${esc(app.previous_version)}` : ''}</p>
                            ${app.release_notes ? `<p class="text-[11px] text-gray-500 mt-1 truncate">${esc(app.release_notes)}</p>` : ''}
                          </div>
                        </button>
                        <button type="button" data-update-download="${esc(app.id)}"
                                class="shrink-0 px-3 py-2 rounded-xl bg-green-600 text-white text-xs font-black hover:bg-green-700">
                          <i class="fa-solid fa-download mr-1"></i> Update
                        </button>
                      </div>`).join('');

                    list.querySelectorAll('[data-update-app]').forEach(el => {
                        el.addEventListener('click', () => {
                            const id = el.getAttribute('data-update-app');
                            if(id) window.location.href = 'app.html?id=' + encodeURIComponent(id);
                        });
                    });

                    list.querySelectorAll('[data-update-download]').forEach(el => {
                        el.addEventListener('click', async (event) => {
                            event.stopPropagation();
                            const id=el.getAttribute('data-update-download');
                            const app=apps.find(x=>String(x.id)===String(id));
                            if(!app) return;
                            const url=String(app.name || '').toLowerCase().includes('paliaapk hub') ? new URL('/WebsitePaliaAPK_V.2/PaliaAPK-HUB.apk', window.location.origin).href : (app.apk_url || '');
                            if(!url){ alert('Update APK is not available for this app.'); return; }
                            el.disabled=true; el.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-1"></i> Updating…';
                            try{
                                const r=await fetch(url,{mode:'cors'});
                                if(!r.ok) throw new Error('HTTP '+r.status);
                                const blob=await r.blob();
                                const blobUrl=URL.createObjectURL(blob);
                                const a=document.createElement('a');
                                a.href=blobUrl;
                                a.download=(app.name||'PaliaAPK-HUB').replace(/[^a-z0-9._-]+/gi,'_')+'.apk';
                                document.body.appendChild(a); a.click(); a.remove();
                                setTimeout(()=>URL.revokeObjectURL(blobUrl),60000);
                            }catch(e){
                                console.error('Update APK download failed without redirect:',e);
                                alert('Update download could not start. Please try again. PaliaAPK HUB was not redirected.');
                            }finally{
                                el.disabled=false; el.innerHTML='<i class="fa-solid fa-download mr-1"></i> Update';
                            }
                        });
                    });
                }catch(err){
                    console.error('Profile updates error:', err);
                    count.textContent='0';
                    count.classList.add('hidden');
                    list.innerHTML = '<div class="py-10 text-center text-sm text-red-500">Unable to load updates. Please try again.</div>';
                }
            }

            const topBtn = document.getElementById('profileUpdatesBtnTop');
            const topCount = document.getElementById('profileUpdatesCountTop');

            async function refreshTopCount(){
                if(!topCount || !paliaSupabase) return;
                try{
                    const {data,error}=await paliaSupabase.from('apps').select('id').eq('update_available',true);
                    if(error) throw error;
                    const n=Array.isArray(data)?data.length:0;
                    topCount.textContent=String(n);
                    topCount.classList.toggle('hidden', n===0);
                    topCount.classList.toggle('inline-flex', n>0);
                }catch(e){
                    topCount.classList.add('hidden');
                }
            }

            topBtn?.addEventListener('click', async () => {
                modal?.classList.remove('hidden');
                modal?.classList.add('flex');
                await loadUpdates();
            });
            if(window.location.hash === '#updates'){
                setTimeout(async () => {
                    modal?.classList.remove('hidden');
                    modal?.classList.add('flex');
                    await loadUpdates();
                }, 150);
            }

            refreshTopCount();
            closeBtn?.addEventListener('click', closeModal);
            modal?.addEventListener('click', e => { if(e.target === modal) closeModal(); });
        })();

        // ===============================
        // AUTH STATE
        // ===============================

        auth.onAuthStateChanged((user) => {

            if (!user) {

                // Login नहीं है
                window.location.href = "user.html";

                return;
            }


            // User name
            const name =
                user.displayName ||
                (user.email
                    ? user.email.split("@")[0]
                    : "User");


            // Email
            const email = user.email || "No email";


            // Avatar initials
            const initials =
                name
                    .trim()
                    .split(/\s+/)
                    .map(word => word.charAt(0))
                    .join("")
                    .substring(0, 2)
                    .toUpperCase();


            // ===============================
            // UPDATE UI
            // ===============================

            document.getElementById("profileAvatar")
                .textContent = initials || "U";

            document.getElementById("profileName")
                .textContent = name;

            document.getElementById("profileEmail")
                .textContent = email;

            document.getElementById("infoName")
                .textContent = name;

            document.getElementById("infoEmail")
                .textContent = email;


            // ===============================
            // LOGIN METHOD
            // ===============================

            let loginMethod = "Email";

            if (user.providerData && user.providerData.length) {

                const provider =
                    user.providerData[0].providerId;

                if (provider === "google.com") {
                    loginMethod = "Google";
                }
                else if (provider === "password") {
                    loginMethod = "Email & Password";
                }
                else {
                    loginMethod = provider;
                }

            }


            document.getElementById("loginMethod")
                .textContent = loginMethod;

        });


        // ===============================
        // LOGOUT
        // ===============================

        document.getElementById("logoutBtn")
            .addEventListener("click", async () => {

                try {

                    await auth.signOut();

                    window.location.href = "index.html";

                }
                catch (error) {

                    console.error("Logout error:", error);

                    alert("Logout failed. Please try again.");

                }

            });

    </script>
