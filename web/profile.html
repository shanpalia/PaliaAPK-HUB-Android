<script id="paliaDarkModeController">
(function () {
  const KEY = 'paliaapk_theme';

  function applyTheme(theme) {
    const root = document.documentElement;
    const dark = theme === 'dark';
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#111827' : '#16a34a');
  }

  function getTheme() {
    const saved = localStorage.getItem(KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }

  applyTheme(getTheme());

  document.addEventListener('DOMContentLoaded', function () {
    applyTheme(getTheme());

    const btn = document.getElementById('darkModeToggle');
    if (!btn || btn.dataset.darkModeBound === '1') return;

    btn.dataset.darkModeBound = '1';
    btn.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      const next = document.documentElement.classList.contains('dark')
        ? 'light' : 'dark';

      localStorage.setItem(KEY, next);
      applyTheme(next);
    });
  });
})();
</script>

        // ===============================

        (function(){
            const btn = document.getElementById('profileUpdatesBtn');
            const modal = document.getElementById('profileUpdatesModal');
            const closeBtn = document.getElementById('closeProfileUpdates');
            const list = document.getElementById('profileUpdatesList');
            const count = document.getElementById('profileUpdatesCountTop');

            function esc(v){
                return String(v ?? '').replace(/[&<>"']/g, c => ({
                    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
                }[c]));
            }

            function closeModal(){
                // Follow Android/Play Store navigation: return to the actual previous screen.
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    // Keep the update screen available when there is no in-app history.
                    modal?.classList.remove('hidden');
                    modal?.classList.add('flex');
                }
            }

            let profileUpdatesLoading = false;
            async function loadUpdates(){
                if(!list || profileUpdatesLoading) return;
                profileUpdatesLoading = true;
                list.innerHTML = '<div class="py-8 text-center text-sm text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Checking for updates…</div>';

                function showRetry(message){
                    list.innerHTML = '<div class="py-8 text-center"><p class="text-sm text-gray-600">'+esc(message)+'</p><button type="button" id="retryProfileUpdates" class="mt-4 px-5 py-2.5 rounded-xl bg-green-600 text-white text-sm font-bold">Try again</button></div>';
                    document.getElementById('retryProfileUpdates')?.addEventListener('click', loadUpdates);
                }

                try{
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 12000);
                    let response;
                    let data;
                    try {
                        response = await fetch(PALIA_SUPABASE_URL + '/rest/v1/apps?select=id,name,version,update_available,icon_url,apk_url,updated_at&update_available=eq.true&order=updated_at.desc', {
                            method: 'GET',
                            cache: 'no-store',
                            signal: controller.signal,
                            headers: {
                                'apikey': PALIA_SUPABASE_ANON_KEY,
                                'Authorization': 'Bearer ' + PALIA_SUPABASE_ANON_KEY,
                                'Accept': 'application/json'
                            }
                        });
                        if (!response.ok) throw new Error('Update service returned HTTP ' + response.status);
                        data = await response.json();
                    } finally {
                        clearTimeout(timeoutId);
                    }

                    const apps = (Array.isArray(data) ? data : []).filter(app => { const name = String(app.name || '').trim().toLowerCase(); const isThisStore = name.includes('paliaapk hub') || name.includes('paliaapk-hub'); if (!isThisStore) return true; const parts = v => String(v || '0').split('.').map(x => parseInt(x, 10) || 0); const current = parts(window.PaliaAppVersion || '1.4.0'); const remote = parts(app.version || '0'); for (let i = 0; i < Math.max(current.length, remote.length); i++) { const a = current[i] || 0, b = remote[i] || 0; if (b > a) return true; if (b < a) return false; } return false; });
                    if(count){
                        count.textContent = String(apps.length);
                        count.classList.toggle('hidden', apps.length === 0);
                        count.classList.toggle('inline-flex', apps.length > 0);
                    }

                    if(!apps.length){
                        list.innerHTML = `
                          <div class="py-10 text-center">
                            <div class="w-14 h-14 mx-auto rounded-2xl bg-green-50 text-green-600 flex items-center justify-center text-xl">
                              <i class="fa-solid fa-check"></i>
                            </div>
                            <p class="mt-3 font-black text-gray-800">You're up to date</p>
                            <p class="text-xs text-gray-500 mt-1">No app update is currently available.</p>
                          </div>`;
                        return;
                    }

                    list.innerHTML = `
                      <div class="flex items-center justify-between mb-3"><p class="text-sm font-bold text-gray-700">${apps.length} updates available</p><span class="text-xs text-gray-500">PaliaAPK HUB</span></div>
                    ` + apps.map(app => `
                      <div class="w-full p-3 mb-3 rounded-2xl border border-gray-200 bg-white shadow-sm" data-update-card="${esc(app.id)}">
                        <div class="flex items-center gap-3">
                          <div class="w-12 h-12 rounded-xl bg-gray-100 overflow-hidden flex items-center justify-center shrink-0">
                            ${app.icon_url ? `<img src="${esc(app.icon_url)}" class="w-full h-full object-cover" alt="">` : `<i class="fa-brands fa-android text-green-600 text-2xl"></i>`}
                          </div>
                          <div class="min-w-0 flex-1"><p class="font-bold text-sm text-gray-900 truncate">${esc(app.name)}</p>
                            <p class="text-xs text-gray-500 mt-1">Update available · Version ${esc(app.version || '—')}</p>
                            <p class="text-xs text-gray-500 mt-1" data-update-status="${esc(app.id)}">Ready to download</p>
                          </div>
                          <button type="button" data-update-download="${esc(app.id)}" class="shrink-0 px-4 py-2.5 rounded-full bg-green-600 text-white text-xs font-bold">Update</button>
                        </div>
                        <div class="hidden mt-3" data-update-progress-wrap="${esc(app.id)}">
                          <div class="flex justify-between gap-3 text-xs text-gray-500 mb-1"><span data-update-progress-label="${esc(app.id)}">Preparing download…</span><span data-update-progress-percent="${esc(app.id)}">0%</span></div>
                          <div class="h-1.5 rounded-full bg-gray-100 overflow-hidden"><div data-update-progress-bar="${esc(app.id)}" class="h-full rounded-full bg-green-600 transition-all" style="width:0%"></div></div>
                        </div>
                      </div>`).join('');

                    list.querySelectorAll('[data-update-app]').forEach(el => {
                        el.addEventListener('click', () => {
                            const id = el.getAttribute('data-update-app');
                            if(id) window.location.href = 'app.html?id=' + encodeURIComponent(id);
                        });
                    });

                    let activeUpdateDownload = false;
                    list.querySelectorAll('[data-update-download]').forEach(el => {
                        el.addEventListener('click', async event => {
                            event.stopPropagation();
                            if(activeUpdateDownload)return;
                            const id=el.getAttribute('data-update-download');
                            const app=apps.find(x=>String(x.id)===String(id)); if(!app)return;
                            let url=String(app.apk_url||app.download_url||'').trim();
                            
                            if(!url){alert('Update APK direct link is not available. Add a direct APK URL to this store listing.');return;}
                            const status=list.querySelector('[data-update-status="'+id+'"]'), wrap=list.querySelector('[data-update-progress-wrap="'+id+'"]'), label=list.querySelector('[data-update-progress-label="'+id+'"]'), pctEl=list.querySelector('[data-update-progress-percent="'+id+'"]'), speedEl=list.querySelector('[data-update-speed="'+id+'"]'), bar=list.querySelector('[data-update-progress-bar="'+id+'"]');
                            const buttons=[...list.querySelectorAll('[data-update-download]')]; activeUpdateDownload=true;
                            buttons.forEach(b=>{b.disabled=true;b.classList.add('opacity-60');}); el.textContent='Starting…'; wrap?.classList.remove('hidden');
                            if(status)status.textContent='Preparing download…';
                            let progressListener=null;
                            try{
                                const cap=window.Capacitor;
                                const native=!!(cap&&((typeof cap.isNativePlatform==='function'&&cap.isNativePlatform())||(typeof cap.getPlatform==='function'&&cap.getPlatform()==='android')));
                                if(native){
                                    const plugin=cap.Plugins?.PaliaDownloader||(typeof cap.registerPlugin==='function'?cap.registerPlugin('PaliaDownloader'):null);
                                    if(!plugin||typeof plugin.download!=='function'||typeof plugin.openDownloadedApk!=='function')throw new Error('Native downloader is not available in this APK build.');
                                    progressListener=await plugin.addListener('downloadProgress',p=>{
                                        const done=Math.max(0,Number(p.downloadedBytes||0)), total=Math.max(0,Number(p.totalBytes||0)), n=total?Math.min(99,Math.round(done/total*100)):0;
                                        const fmt=v=>{if(!v)return '0 B';const u=['B','KB','MB','GB'],i=Math.min(3,Math.floor(Math.log(v)/Math.log(1024)));return (v/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i];};
                                        if(pctEl)pctEl.textContent=total?n+'%':fmt(done);
                                        if(bar&&total)bar.style.width=n+'%';
                                         if(speedEl)speedEl.textContent=fmt(Number(p.speedBytesPerSecond||0))+'/s';
                                        if(label)label.textContent=total?fmt(done)+' of '+fmt(total):fmt(done)+' downloaded';
                                        if(status)status.textContent='Downloading update…';
                                        el.textContent=total?n+'%':'Downloading…';
                                    });
                                    await plugin.download({url,filename:(String(app.name||'PaliaAPK-HUB').replace(/[^a-z0-9._-]+/gi,'_'))+'-update.apk'});
                                    if(status)status.textContent='Download complete · Opening Android installer';
                                    if(label)label.textContent='Download complete'; if(pctEl)pctEl.textContent='100%'; if(bar)bar.style.width='100%';
                                    el.textContent='Install'; await plugin.openDownloadedApk();
                                    if(status)status.textContent='Installer opened. Follow Android instructions to finish updating.';
                                }else{if(status)status.textContent='Opening APK download in browser…';window.location.href=url;}
                            }catch(e){
                                console.error('Update APK download failed:',e);
                                if(status)status.textContent='Download failed. Check connection or APK link and try again.';
                                alert('Update download failed: '+(e&&e.message?e.message:'Check your connection and APK link.'));
                            }finally{
                                if(progressListener&&typeof progressListener.remove==='function'){try{await progressListener.remove();}catch(e){}}
                                activeUpdateDownload=false;buttons.forEach(b=>{b.disabled=false;b.classList.remove('opacity-60');});
                                if(el.isConnected&&el.textContent!=='Install')el.textContent='Update';
                            }
                        });
                    });
                }catch(err){
                    console.error('Profile updates error:', err);
                    if(count){ count.textContent='0'; count.classList.add('hidden'); }
                    showRetry(err && err.name === 'AbortError' ? 'Update check timed out. Check your internet connection.' : 'Could not load updates. Please try again. Check your internet connection and Supabase app-table access.');
                } finally {
                    profileUpdatesLoading = false;
                }
            }

            const topBtn = document.getElementById('profileUpdatesBtnTop');
            const topCount = document.getElementById('profileUpdatesCountTop');

            async function refreshTopCount(){
                if(!topCount || !window.paliaSupabase) return;
                try{
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    let response;
                    let data;
                    try {
                        response = await fetch(PALIA_SUPABASE_URL + '/rest/v1/apps?select=id&update_available=eq.true', {
                            cache: 'no-store',
                            signal: controller.signal,
                            headers: {
                                'apikey': PALIA_SUPABASE_ANON_KEY,
                                'Authorization': 'Bearer ' + PALIA_SUPABASE_ANON_KEY,
                                'Accept': 'application/json'
                            }
                        });
                        if (!response.ok) throw new Error('Update count returned HTTP ' + response.status);
                        data = await response.json();
                    } finally {
                        clearTimeout(timeoutId);
                    }
                    const n=Array.isArray(data)?data.length:0;
                    topCount.textContent=String(n);
                    topCount.classList.toggle('hidden', n===0);
                    topCount.classList.toggle('inline-flex', n>0);
                }catch(e){
                    topCount.classList.add('hidden');
                }
            }

            topBtn?.addEventListener('click', async () => {
                modal?.classList.remove('hidden');
                modal?.classList.add('flex');
                await loadUpdates();
            });
            // Keep the normal profile page visible. Open updates only when the user taps App Updates.
            refreshTopCount();
            closeBtn?.addEventListener('click', closeModal);
            modal?.addEventListener('click', e => { if(e.target === modal) closeModal(); });

            // Make the Android system Back button follow the same navigation as Play Store.
            // Push a lightweight history entry so Back first exits the updates screen state.
            if (!window.__paliaUpdatesBackBound) {
                window.__paliaUpdatesBackBound = true;
                try { window.history.pushState({ paliaUpdatesScreen: true }, '', window.location.pathname + '#updates'); } catch (_) {}
                window.addEventListener('popstate', function () {
                    // Do not force a homepage redirect. Let the WebView/browser restore its previous route.
                });
            }
        })();

        // ===============================
        // AUTH STATE
        // ===============================

        auth.onAuthStateChanged((user) => {

            if (!user) {

                // Login नहीं है
                return;
            }


            // User name
            const name =
                user.displayName ||
                (user.email
                    ? user.email.split("@")[0]
                    : "User");


            // Email
            const email = user.email || "No email";


            // Avatar initials
            const initials =
                name
                    .trim()
                    .split(/\s+/)
                    .map(word => word.charAt(0))
                    .join("")
                    .substring(0, 2)
                    .toUpperCase();


            // ===============================
            // UPDATE UI
            // ===============================

            document.getElementById("profileAvatar")
                .textContent = initials || "U";

            document.getElementById("profileName")
                .textContent = name;

            document.getElementById("profileEmail")
                .textContent = email;

            document.getElementById("infoName")
                .textContent = name;

            document.getElementById("infoEmail")
                .textContent = email;


            // ===============================
            // LOGIN METHOD
            // ===============================

            let loginMethod = "Email";

            if (user.providerData && user.providerData.length) {

                const provider =
                    user.providerData[0].providerId;

                if (provider === "google.com") {
                    loginMethod = "Google";
                }
                else if (provider === "password") {
                    loginMethod = "Email & Password";
                }
                else {
                    loginMethod = provider;
                }

            }


            document.getElementById("loginMethod")
                .textContent = loginMethod;

        });


        // ===============================
        // LOGOUT
        // ===============================

        document.getElementById("logoutBtn")
            .addEventListener("click", async () => {

                try {

                    await auth.signOut();

                    window.location.href = "index.html";

                }
                catch (error) {

                    console.error("Logout error:", error);

                    alert("Logout failed. Please try again.");

                }

            });

    </script>

</body>
</html>
