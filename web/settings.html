<script id="paliaDarkModeController">
(function () {
  const KEY = 'paliaapk_theme';

  function applyTheme(theme) {
    const root = document.documentElement;
    const dark = theme === 'dark';
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#111827' : '#16a34a');
  }

  function getTheme() {
    const saved = localStorage.getItem(KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }

  applyTheme(getTheme());

  document.addEventListener('DOMContentLoaded', function () {
    applyTheme(getTheme());

    const btn = document.getElementById('darkModeToggle');
    if (!btn || btn.dataset.darkModeBound === '1') return;

    btn.dataset.darkModeBound = '1';
    btn.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      const next = document.documentElement.classList.contains('dark')
        ? 'light' : 'dark';

      localStorage.setItem(KEY, next);
      applyTheme(next);
    });
  });
})();
</script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCn7GUkOaFO4l0x1zM5mwW4hFkW2ISxR10",
    authDomain: "shanpalia-apk-hub.firebaseapp.com",
    projectId: "shanpalia-apk-hub",
    storageBucket: "shanpalia-apk-hub.firebasestorage.app",
    messagingSenderId: "270953807883",
    appId: "1:270953807883:web:c900f4409938f16477870e",
    measurementId: "G-7BMQEGPY8C"
};


if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();

const themeToggle = document.getElementById("themeToggle");
const themeDot = document.getElementById("themeDot");
const themeIcon = document.getElementById("themeIcon");
const themeLabel = document.getElementById("themeLabel");

const notificationToggle =
    document.getElementById("notificationToggle");

const notificationDot =
    document.getElementById("notificationDot");

const notificationLabel =
    document.getElementById("notificationLabel");

function applyTheme() {

    const dark =
        localStorage.getItem("palia_theme") === "dark";

    document.documentElement.classList.toggle("dark", dark);

    if (dark) {
        themeToggle.classList.remove("bg-gray-200");
        themeToggle.classList.add("bg-green-600");

        themeDot.classList.remove("left-1");
        themeDot.classList.add("right-1");

        themeIcon.className = "fa-solid fa-moon";
        themeLabel.textContent = "Dark mode";
    } else {
        themeToggle.classList.remove("bg-green-600");
        themeToggle.classList.add("bg-gray-200");

        themeDot.classList.remove("right-1");
        themeDot.classList.add("left-1");

        themeIcon.className = "fa-solid fa-sun";
        themeLabel.textContent = "Light mode";
    }
}

function applyNotifications() {

    const enabled =
        localStorage.getItem("palia_notifications") !== "off";

    if (enabled) {

        notificationToggle.classList.remove("bg-gray-300");
        notificationToggle.classList.add("bg-green-600");

        notificationDot.classList.remove("left-1");
        notificationDot.classList.add("right-1");

        notificationLabel.textContent =
            "Notifications enabled";

    } else {

        notificationToggle.classList.remove("bg-green-600");
        notificationToggle.classList.add("bg-gray-300");

        notificationDot.classList.remove("right-1");
        notificationDot.classList.add("left-1");

        notificationLabel.textContent =
            "Notifications disabled";
    }
}

themeToggle.addEventListener("click", () => {

    const current =
        localStorage.getItem("palia_theme") === "dark";

    localStorage.setItem(
        "palia_theme",
        current ? "light" : "dark"
    );

    applyTheme();
});

notificationToggle.addEventListener("click", () => {

    const current =
        localStorage.getItem("palia_notifications") !== "off";

    localStorage.setItem(
        "palia_notifications",
        current ? "off" : "on"
    );

    applyNotifications();
});

auth.onAuthStateChanged(user => {

    if (!user) {
        window.location.href = "user.html";
        return;
    }

    document.getElementById("accountEmail").textContent =
        user.email || "No email";
});

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

    try {

        await auth.signOut();

        window.location.href = "index.html";

    } catch (error) {

        console.error("Logout error:", error);

        alert("Logout failed. Please try again.");
    }
});

applyTheme();
applyNotifications();
</script>
