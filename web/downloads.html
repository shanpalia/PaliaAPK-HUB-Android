<script id="paliaDarkModeController">
(function () {
  const KEY = 'paliaapk_theme';

  function applyTheme(theme) {
    const root = document.documentElement;
    const dark = theme === 'dark';
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#111827' : '#16a34a');
  }

  function getTheme() {
    const saved = localStorage.getItem(KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }

  applyTheme(getTheme());

  document.addEventListener('DOMContentLoaded', function () {
    applyTheme(getTheme());

    const btn = document.getElementById('darkModeToggle');
    if (!btn || btn.dataset.darkModeBound === '1') return;

    btn.dataset.darkModeBound = '1';
    btn.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      const next = document.documentElement.classList.contains('dark')
        ? 'light' : 'dark';

      localStorage.setItem(KEY, next);
      applyTheme(next);
    });
  });
})();
</script>

async function loadDownloads() {
    if (!currentUser) return;

    const loading = document.getElementById("loadingState");
    const error = document.getElementById("errorState");
    const empty = document.getElementById("emptyState");
    const list = document.getElementById("downloadsList");

    loading.classList.remove("hidden");
    error.classList.add("hidden");
    empty.classList.add("hidden");
    list.classList.add("hidden");
    list.innerHTML = "";

    try {
        const { data, error: dbError } = await db
            .from("downloads")
            .select("*")
            .eq("user_id", currentUser.uid)
            .order("downloaded_at", { ascending: false });

        if (dbError) throw dbError;

        loading.classList.add("hidden");

        const downloads = data || [];
        document.getElementById("downloadCount").textContent =
            downloads.length.toLocaleString();

        if (!downloads.length) {
            empty.classList.remove("hidden");
            return;
        }

        downloads.forEach(item => {
            const row = document.createElement("div");
            row.className =
                "app-card bg-white rounded-3xl border border-gray-100 shadow-sm p-4 sm:p-5";

            const icon = item.icon_url || "";
            const name = item.app_name || "Unknown App";
            const version = item.version || "Unknown";
            const date = item.downloaded_at
                ? new Date(item.downloaded_at).toLocaleString("en-IN", {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                })
                : "Unknown date";

            row.innerHTML = `

                    <div class="w-16 h-16 rounded-2xl bg-green-50 overflow-hidden flex-shrink-0 flex items-center justify-center text-green-600 text-2xl">

                            : `<i class="fa-solid fa-mobile-screen-button"></i>`}
                    </div>

                    <div class="min-w-0 flex-1">
                        <h3 class="font-black text-gray-900 line-clamp-1">${escapeHtml(name)}</h3>
                        <p class="text-xs text-gray-500 mt-1">Version ${escapeHtml(version)}</p>
                        <p class="text-xs text-gray-400 mt-1">
                            <i class="fa-regular fa-clock mr-1"></i>${escapeHtml(date)}
                        </p>
                    </div>

                    ${item.download_url ? `
                    <button type="button" data-redownload-url="${escapeHtml(item.download_url)}"
                       data-redownload-name="${escapeHtml(name || 'PaliaAPK-HUB')}.apk"
                       class="flex-shrink-0 w-11 h-11 rounded-xl bg-green-50 text-green-600 flex items-center justify-center hover:bg-green-100"
                       title="Download again">
                        <i class="fa-solid fa-download"></i>
                    </button>` : ""}
                </div>
            `;

            list.appendChild(row);
        });

        list.classList.remove("hidden");

    } catch (err) {
        console.error("Downloads error:", err);
        loading.classList.add("hidden");
        error.classList.remove("hidden");
        document.getElementById("errorText").textContent =
            err.message || "Please try again.";
    }
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

<script id="paliaSafeRedownloads">
document.addEventListener('click', async function(e){
    const btn=e.target.closest && e.target.closest('[data-redownload-url]');
    if(!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const url=btn.getAttribute('data-redownload-url');
    const name=btn.getAttribute('data-redownload-name') || 'PaliaAPK-HUB.apk';
    if(!url) return;

    const old=btn.innerHTML;
    btn.disabled=true;
    btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';

    try{
        const response=await fetch(url,{
            method:'GET',
            mode:'cors',
            credentials:'omit',
            redirect:'follow',
            cache:'no-store'
        });
        if(!response.ok) throw new Error('HTTP '+response.status);
        const blob=await response.blob();
        if(!blob.size) throw new Error('Empty APK response');

        const blobUrl=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=blobUrl;
        a.download=name;
        a.rel='noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(blobUrl),120000);
    }catch(err){
        console.error('APK re-download failed without redirect:',err);
        alert('APK download could not start. PaliaAPK HUB was not redirected.');
    }finally{
        btn.disabled=false;
        btn.innerHTML=old;
    }
},true);
</script>
